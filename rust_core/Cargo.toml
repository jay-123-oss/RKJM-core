[package]
name = "wave_brain_core"
version = "0.1.0"
edition = "2021"
description = "Bare-Metal Associative Reasoning Engine for RKMJ-Core"
authors = ["RKMJ AI Team"]

[lib]
name = "wave_brain_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

[features]
default = []
python = ["dep:pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
