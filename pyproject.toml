[build-system]
requires = ["setuptools>=61.0", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "rkmj"
version = "0.1.0"
description = "RKMJ-Core: 1.58-bit Carry-Save Addition (CSA) Transformer Framework for CPU"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rkmj*"]
